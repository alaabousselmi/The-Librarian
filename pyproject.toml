[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-librarian"
version = "0.1.0"
description = "A RAG service that answers FastAPI questions from the official docs, GitHub Discussions and issues, with citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "openai>=1.40",
    "httpx>=0.27",
    "typer>=0.12",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
librarian = "librarian.cli:app"

[tool.setuptools.packages.find]
include = ["librarian*"]

[tool.setuptools.package-data]
librarian = ["api/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
