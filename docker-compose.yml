# Local stack: Qdrant + The Librarian.
#   docker compose run --rm app librarian build    # setup: ingest corpus + build index
#   docker compose up                              # run: http://localhost:8000
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes:
      - app_data:/app/data
    depends_on: [qdrant]
    restart: unless-stopped

volumes:
  qdrant_data:
  app_data:
